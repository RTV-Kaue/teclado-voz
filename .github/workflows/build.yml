name: Compilar IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Escolher o Xcode mais recente
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Usando $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Instalar ferramentas
        run: brew install xcodegen ldid

      - name: Dicionário e previsão de palavras
        run: |
          set -e
          mkdir -p /tmp/dados
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/wooorm/dictionaries /tmp/dados/wd
          (cd /tmp/dados/wd && git sparse-checkout set dictionaries/pt)
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/hermitdave/FrequencyWords /tmp/dados/fw
          (cd /tmp/dados/fw && git sparse-checkout set content/2018/pt_br)
          python3 tools/build_words.py /tmp/dados/fw/content/2018/pt_br/pt_br_full.txt \
            /tmp/dados/wd/dictionaries/pt/index.aff /tmp/dados/wd/dictionaries/pt/index.dic Keyboard/palavras.txt 90000
          SRC=""
          if curl -fsSL https://downloads.tatoeba.org/exports/per_language/por/por_sentences.tsv.bz2 -o /tmp/dados/por.tsv.bz2; then
            SRC="$SRC /tmp/dados/por.tsv.bz2"
          fi
          for C in por-br_web_2015_1M por-br_newscrawl_2011_1M por_news_2020_1M por_news_2013_1M por_wikipedia_2021_1M; do
            if curl -fsSL --max-time 300 "https://downloads.wortschatz-leipzig.de/corpora/$C.tar.gz" -o /tmp/dados/c.tar.gz; then
              mkdir -p /tmp/dados/c && tar -xzf /tmp/dados/c.tar.gz -C /tmp/dados/c
              F=$(find /tmp/dados/c -name "*-sentences.txt" | head -1)
              if [ -n "$F" ]; then SRC="$SRC $F"; echo "corpus: $C"; break; fi
            fi
          done
          python3 tools/build_bigrams.py Keyboard/palavras.txt Keyboard/bigramas.txt $SRC
          wc -l Keyboard/palavras.txt Keyboard/bigramas.txt
          head -3 Keyboard/bigramas.txt

      - name: Gerar projeto
        run: xcodegen generate

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild -project TecladoVoz.xcodeproj -target TecladoVoz \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error|warning: unable|BUILD" || true
          test -d build/Release-iphoneos/TecladoVoz.app

      - name: Gravar permissões (entitlements) e empacotar
        run: |
          APP=build/Release-iphoneos/TecladoVoz.app
          ldid -SKeyboard/Teclado.entitlements "$APP/PlugIns/Teclado.appex/Teclado"
          if [ -d "$APP/PlugIns/Atividade.appex" ]; then ldid -S "$APP/PlugIns/Atividade.appex/Atividade"; fi
          ls "$APP/PlugIns"
          ldid -SApp/TecladoVoz.entitlements "$APP/TecladoVoz"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TecladoVoz.ipa Payload
          ls -la TecladoVoz.ipa

      - name: Log de compilação (se der erro)
        if: failure()
        run: grep -n -B2 -A6 "error:" build.log | head -200 || true

      - uses: actions/upload-artifact@v4
        with:
          name: TecladoVoz-ipa
          path: TecladoVoz.ipa

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Teclado Voz (build ${{ github.run_number }})
          files: TecladoVoz.ipa
          make_latest: true
