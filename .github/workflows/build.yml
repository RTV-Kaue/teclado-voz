name: Compilar IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Escolher o Xcode mais recente
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Usando $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Instalar ferramentas
        run: brew install xcodegen ldid

      - name: Baixar dicionário de português
        run: |
          set -e
          for U in \
            https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/pt_br/pt_br_50k.txt \
            https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2016/pt_br/pt_br_50k.txt; do
            if curl -fsSL "$U" -o Keyboard/palavras.txt; then break; fi
          done
          test -s Keyboard/palavras.txt
          wc -l Keyboard/palavras.txt
          head -5 Keyboard/palavras.txt

      - name: Gerar previsão de palavras (frases do Tatoeba)
        continue-on-error: true
        run: |
          curl -fsSL https://downloads.tatoeba.org/exports/per_language/por/por_sentences.tsv.bz2 -o /tmp/por.tsv.bz2
          python3 - <<'PY'
          import bz2, re, collections
          pairs = collections.defaultdict(collections.Counter)
          word = re.compile(r"[a-záàâãéêíóôõúüç]+(?:-[a-záàâãéêíóôõúüç]+)*")
          with bz2.open('/tmp/por.tsv.bz2', 'rt', encoding='utf-8') as f:
              for line in f:
                  parts = line.rstrip('\n').split('\t')
                  if len(parts) < 3: continue
                  for sent in re.split(r'[.!?]+', parts[2].lower()):
                      toks = word.findall(sent)
                      prev = '^'
                      for t in toks:
                          pairs[prev][t] += 1
                          prev = t
          with open('Keyboard/bigramas.txt', 'w', encoding='utf-8') as out:
              n = 0
              for w, c in pairs.items():
                  top = [x for x, k in c.most_common(5) if k >= 2]
                  if top:
                      out.write(w + '\t' + ' '.join(top) + '\n'); n += 1
          print('bigramas:', n)
          PY
          wc -l Keyboard/bigramas.txt

      - name: Gerar projeto
        run: xcodegen generate

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild -project TecladoVoz.xcodeproj -target TecladoVoz \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error|warning: unable|BUILD" || true
          test -d build/Release-iphoneos/TecladoVoz.app

      - name: Gravar permissões (entitlements) e empacotar
        run: |
          APP=build/Release-iphoneos/TecladoVoz.app
          ldid -SKeyboard/Teclado.entitlements "$APP/PlugIns/Teclado.appex/Teclado"
          ldid -SApp/TecladoVoz.entitlements "$APP/TecladoVoz"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TecladoVoz.ipa Payload
          ls -la TecladoVoz.ipa

      - name: Log de compilação (se der erro)
        if: failure()
        run: grep -n -B2 -A6 "error:" build.log | head -200 || true

      - uses: actions/upload-artifact@v4
        with:
          name: TecladoVoz-ipa
          path: TecladoVoz.ipa

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Teclado Voz (build ${{ github.run_number }})
          files: TecladoVoz.ipa
          make_latest: true
