name: TecladoVoz
options:
  bundleIdPrefix: com.kaue
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.2"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: "NO"
    OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
targets:
  TecladoVoz:
    type: application
    platform: iOS
    sources: [App, Shared, LiveActivity]
    dependencies:
      - target: Teclado
      - target: Atividade
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Teclado Voz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: O microfone é usado para transformar sua fala em texto no teclado.
        NSSpeechRecognitionUsageDescription: O reconhecimento de voz transforma sua fala em texto.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.kaue.tecladovoz
            CFBundleURLSchemes: [tecladovoz]
    entitlements:
      path: App/TecladoVoz.entitlements
      properties:
        com.apple.security.application-groups: [group.com.kaue.tecladovoz]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaue.tecladovoz
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Teclado:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Teclado Voz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: pt-BR
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/Teclado.entitlements
      properties:
        com.apple.security.application-groups: [group.com.kaue.tecladovoz]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaue.tecladovoz.teclado
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/Teclado-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: "YES"
  Atividade:
    type: app-extension
    platform: iOS
    sources: [Widget, LiveActivity]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Teclado Voz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaue.tecladovoz.atividade
